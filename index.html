<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <meta name="description" content="Olympico — fast-paced arcade vehicle soccer in the browser.">
  <title>Olympico</title>
  <style>
    :root {
      --ink: #f7fbff;
      --muted: #93a8bd;
      --panel: rgba(7, 16, 29, .86);
      --panel-strong: rgba(9, 21, 38, .96);
      --line: rgba(176, 214, 255, .16);
      --blue: #16a8ff;
      --blue-hot: #51d5ff;
      --orange: #ff7a18;
      --orange-hot: #ffc14d;
      --lime: #baff41;
      --danger: #ff496a;
      --display: "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
      --body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050b14; color: var(--ink); font-family: var(--body); }
    button, input, select { font: inherit; }
    button { color: inherit; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 44%, transparent 36%, rgba(2, 6, 12, .28) 100%); z-index: 1; }
    .screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: clamp(18px, 4vw, 56px); transition: opacity .25s ease, visibility .25s; }
    .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #menu { background: linear-gradient(90deg, rgba(3, 9, 18, .96) 0%, rgba(3, 9, 18, .82) 42%, rgba(3, 9, 18, .18) 72%, transparent 100%); place-items: center start; }
    .menu-card { width: min(560px, 100%); padding: clamp(24px, 5vw, 58px); border: 1px solid var(--line); background: linear-gradient(145deg, rgba(11, 25, 43, .93), rgba(6, 14, 25, .8)); box-shadow: 0 28px 80px rgba(0, 0, 0, .44), inset 0 1px rgba(255,255,255,.04); backdrop-filter: blur(18px); clip-path: polygon(0 0, 94% 0, 100% 7%, 100% 100%, 6% 100%, 0 93%); }
    .eyebrow { color: var(--blue-hot); font-size: .78rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .brand { margin: 8px 0 0; font-family: var(--display); font-size: clamp(4.1rem, 11vw, 7rem); font-style: italic; font-weight: 900; letter-spacing: -.06em; line-height: .88; text-transform: uppercase; text-shadow: 0 0 32px rgba(22, 168, 255, .24); }
    .brand span { color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.7); }
    .tagline { margin: 14px 0 30px; color: var(--muted); font-size: 1rem; letter-spacing: .03em; }
    .menu-actions { display: grid; gap: 11px; }
    .action { position: relative; min-height: 56px; padding: 0 20px; border: 1px solid var(--line); background: rgba(255,255,255,.035); display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; font-weight: 850; transition: transform .16s, border-color .16s, background .16s; overflow: hidden; }
    .action::before { content: ""; position: absolute; inset: 0; width: 4px; background: var(--blue); transition: width .18s ease; z-index: -1; }
    .action:hover, .action:focus-visible { transform: translateX(6px); border-color: rgba(81, 213, 255, .65); outline: none; }
    .action:hover::before, .action:focus-visible::before { width: 100%; background: linear-gradient(90deg, rgba(22,168,255,.38), rgba(22,168,255,.06)); }
    .action.primary { background: linear-gradient(90deg, rgba(22,168,255,.28), rgba(22,168,255,.06)); border-color: rgba(81, 213, 255, .5); }
    .action small { color: var(--muted); font-size: .68rem; letter-spacing: .08em; }
    .footer-note { margin-top: 22px; display: flex; gap: 18px; color: #6e849a; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .key { display: inline-grid; place-items: center; min-width: 25px; height: 22px; padding: 0 6px; margin-right: 5px; color: #dceeff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.13); border-bottom-width: 2px; border-radius: 4px; font-size: .68rem; font-weight: 800; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0; transition: opacity .25s; }
    #hud.visible { opacity: 1; }
    .scoreboard { position: absolute; left: 50%; top: max(15px, env(safe-area-inset-top)); transform: translateX(-50%); display: grid; grid-template-columns: 82px 110px 82px; height: 54px; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
    .score { display: grid; place-items: center; font-family: var(--display); font-size: 2rem; font-weight: 900; transform: skewX(-9deg); }
    .score span { transform: skewX(9deg); }
    .score.blue { background: linear-gradient(135deg, #0867d2, var(--blue)); }
    .score.orange { background: linear-gradient(135deg, var(--orange), #da3e0b); }
    .clock { display: grid; place-items: center; margin: 0 -5px; background: rgba(5,13,24,.92); border-block: 1px solid rgba(255,255,255,.15); font-family: var(--display); font-size: 1.45rem; font-weight: 850; letter-spacing: .06em; z-index: 1; }
    .boost-cluster { position: absolute; right: clamp(18px, 3.8vw, 58px); bottom: max(24px, env(safe-area-inset-bottom)); width: 142px; height: 142px; }
    .boost-ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--orange-hot) calc(var(--boost, 100) * 1%), rgba(255,255,255,.08) 0); filter: drop-shadow(0 0 12px rgba(255, 159, 41, .26)); }
    .boost-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: rgba(5,13,24,.88); border: 1px solid rgba(255,255,255,.12); }
    .boost-value { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; font-family: var(--display); font-size: 2.8rem; font-weight: 900; }
    .boost-label { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 2; color: var(--orange-hot); font-size: .62rem; font-weight: 900; letter-spacing: .22em; }
    .speed { position: absolute; right: 126px; bottom: 25px; min-width: 110px; text-align: right; color: rgba(255,255,255,.9); font-family: var(--display); font-size: 2rem; font-weight: 850; }
    .speed small { display: block; color: var(--muted); font-family: var(--body); font-size: .58rem; letter-spacing: .18em; }
    .mode-pill { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 9px 15px; color: #b8ccdf; background: rgba(5,13,24,.72); border: 1px solid rgba(255,255,255,.11); border-radius: 100px; font-size: .7rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    #announcement { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(4rem, 12vw, 10rem); font-weight: 1000; font-style: italic; letter-spacing: -.04em; text-transform: uppercase; text-shadow: 0 4px 0 rgba(0,0,0,.24), 0 0 42px currentColor; opacity: 0; transform: scale(.82); transition: opacity .2s, transform .3s cubic-bezier(.2,.8,.2,1); }
    #announcement.show { opacity: 1; transform: scale(1); }
    #ballIndicator { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; display: none; transform-origin: center; filter: drop-shadow(0 0 6px rgba(255,255,255,.35)); }
    #ballIndicator::before { content: ""; position: absolute; left: 15px; top: 5px; width: 20px; height: 31px; background: linear-gradient(var(--orange-hot), #fff1a8); clip-path: polygon(50% 0, 100% 70%, 65% 62%, 65% 100%, 35% 100%, 35% 62%, 0 70%); }
    #toast { position: fixed; left: 50%; bottom: 90px; z-index: 50; transform: translate(-50%, 20px); max-width: min(440px, calc(100% - 32px)); padding: 12px 16px; color: #dfefff; background: rgba(5,13,24,.94); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 36px rgba(0,0,0,.4); font-size: .82rem; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 720px) {
      #menu { background: rgba(3, 9, 18, .72); place-items: end center; }
      .menu-card { padding: 26px 24px 30px; }
      .brand { font-size: 4.25rem; }
      .tagline { margin-bottom: 22px; }
      .scoreboard { grid-template-columns: 65px 92px 65px; height: 46px; }
      .score { font-size: 1.65rem; }
      .clock { font-size: 1.18rem; }
      .boost-cluster { width: 104px; height: 104px; right: 14px; bottom: 18px; }
      .boost-value { font-size: 2.1rem; }
      .boost-label { bottom: 14px; }
      .speed { right: 90px; bottom: 15px; font-size: 1.5rem; }
      .mode-pill { bottom: 18px; font-size: .58rem; }
    }
  </style>
  <script type="importmap">

  </script>

<body>
  <canvas id="game" aria-label="Olympico game arena"></canvas>
  <div id="vignette"></div>

  <main id="menu" class="screen">
    <section class="menu-card" aria-labelledby="gameTitle">
      <div class="eyebrow">Arcade vehicle football</div>
      <h1 class="brand" id="gameTitle">Olymp<span>ico</span></h1>
      <p class="tagline">Hit the impossible angle.</p>
      <nav class="menu-actions" aria-label="Game modes">
        <button class="action primary" data-action="quick-match"><span>Quick Match</span><small>1v1</small></button>
        <button class="action" data-action="single-player"><span>Single Player</span><small>1v1 — 4v4</small></button>
        <button class="action" data-action="multiplayer"><span>Direct Connect</span><small>P2P lobby</small></button>
        <button class="action" data-action="training"><span>Training Grounds</span><small>Infinite boost</small></button>
        <button class="action" data-action="garage"><span>Garage</span><small>Customize</small></button>
      </nav>
      <div class="footer-note"><span><b class="key">WASD</b> Drive</span><span><b class="key">J</b> Jump</span><span><b class="key">Shift</b> Boost</span></div>
    </section>
  </main>

  <section id="hud" aria-label="Match HUD">
    <div class="scoreboard"><div class="score blue"><span id="blueScore">0</span></div><div class="clock" id="clock">05:00</div><div class="score orange"><span id="orangeScore">0</span></div></div>
    <div id="announcement" aria-live="assertive"></div>
    <div id="ballIndicator" aria-label="Ball direction"></div>
    <div class="mode-pill" id="cameraMode">Car cam · C to toggle</div>
    <div class="speed"><span id="speed">000</span><small>KM/H</small></div>
    <div class="boost-cluster" id="boostCluster"><div class="boost-ring"></div><div class="boost-value" id="boostValue">100</div><div class="boost-label">BOOST</div></div>
  </section>
  <div id="toast" role="status"></div>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';

    const canvas = document.querySelector('#game');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07101d);
    scene.fog = new THREE.FogExp2(0x07101d, .012);

    const camera = new THREE.PerspectiveCamera(64, innerWidth / innerHeight, .1, 800);
    camera.position.set(0, 24, 44);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    scene.add(new THREE.HemisphereLight(0x9cd8ff, 0x07111d, 2.2));
    const sun = new THREE.DirectionalLight(0xffffff, 3.2);
    sun.position.set(-18, 32, 22);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);

    const field = new THREE.Mesh(new THREE.PlaneGeometry(76, 110), new THREE.MeshStandardMaterial({ color: 0x102f2c, roughness: .84, metalness: .05 }));
    field.rotation.x = -Math.PI / 2;
    field.receiveShadow = true;
    scene.add(field);

    const stripeMat = new THREE.MeshBasicMaterial({ color: 0x1f4c43, transparent: true, opacity: .5 });
    for (let z = -50; z <= 50; z += 10) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(76, 5), stripeMat);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, .012, z);
      scene.add(stripe);
    }

    const lineMat = new THREE.LineBasicMaterial({ color: 0xe8fbff, transparent: true, opacity: .5 });
    const boundary = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-36,.04,-53), new THREE.Vector3(36,.04,-53), new THREE.Vector3(36,.04,53), new THREE.Vector3(-36,.04,53), new THREE.Vector3(-36,.04,-53)
    ]), lineMat);
    scene.add(boundary);
    const mid = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-36,.04,0), new THREE.Vector3(36,.04,0)]), lineMat);
    scene.add(mid);

    function goal(color, z) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .35, metalness: .5, roughness: .28 });
      const postGeo = new THREE.BoxGeometry(.5, 6, .5);
      for (const x of [-10, 10]) { const post = new THREE.Mesh(postGeo, mat); post.position.set(x, 3, z); group.add(post); }
      const bar = new THREE.Mesh(new THREE.BoxGeometry(20.5, .5, .5), mat); bar.position.set(0, 6, z); group.add(bar);
      scene.add(group);
    }
    goal(0x16a8ff, -54.5); goal(0xff7a18, 54.5);

    const stars = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0x9ed9ff, size: .16, transparent: true, opacity: .7 }));
    const positions = new Float32Array(900);
    for (let i = 0; i < positions.length; i += 3) { positions[i] = (Math.random()-.5)*180; positions[i+1] = 20+Math.random()*80; positions[i+2]=(Math.random()-.5)*180; }
    stars.geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3)); scene.add(stars);

    const physics = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0), allowSleep: true });
    physics.broadphase = new CANNON.SAPBroadphase(physics);
    physics.solver.iterations = 10;
    physics.defaultContactMaterial.friction = .16;
    physics.defaultContactMaterial.restitution = .08;
    const floorBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
    floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    physics.addBody(floorBody);

    const input = {
      throttle: 0, steer: 0, pitch: 0, yaw: 0, roll: 0,
      boost: false, handbrake: false, jumpQueued: false,
      keys: new Set(), spaceStarted: 0, cameraToggleQueued: false,
      poll() {
        const gp = navigator.getGamepads?.()[0];
        const dz = v => Math.abs(v) < .13 ? 0 : v;
        const keyThrottle = (this.keys.has('KeyW') || this.keys.has('ArrowUp') ? 1 : 0) - (this.keys.has('KeyS') || this.keys.has('ArrowDown') ? 1 : 0);
        const keySteer = (this.keys.has('KeyA') || this.keys.has('ArrowLeft') ? 1 : 0) - (this.keys.has('KeyD') || this.keys.has('ArrowRight') ? 1 : 0);
        this.throttle = gp ? Math.abs(dz(gp.axes[1])) > Math.abs(keyThrottle) ? -dz(gp.axes[1]) : keyThrottle : keyThrottle;
        this.steer = gp ? Math.abs(dz(gp.axes[0])) > Math.abs(keySteer) ? -dz(gp.axes[0]) : keySteer : keySteer;
        this.boost = this.keys.has('ShiftLeft') || this.keys.has('ShiftRight') || !!gp?.buttons[5]?.pressed;
        this.handbrake = this.keys.has('Space') || !!gp?.buttons[1]?.pressed;
        this.pitch = this.throttle;
        this.yaw = this.steer;
        this.roll = this.handbrake ? this.steer : (gp ? dz(gp.axes[2] || 0) : 0);
        if (gp?.buttons[0]?.pressed && !this.gpJumpHeld) this.jumpQueued = true;
        this.gpJumpHeld = !!gp?.buttons[0]?.pressed;
        if (gp?.buttons[10]?.pressed && !this.gpCamHeld) this.cameraToggleQueued = true;
        this.gpCamHeld = !!gp?.buttons[10]?.pressed;
      }
    };
    addEventListener('keydown', e => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
      input.keys.add(e.code);
      if ((e.code === 'KeyJ' || e.code === 'Numpad0') && !e.repeat) input.jumpQueued = true;
      if (e.code === 'Space' && !e.repeat) input.spaceStarted = performance.now();
      if (e.code === 'KeyC' && !e.repeat) input.cameraToggleQueued = true;
    });
    addEventListener('keyup', e => {
      input.keys.delete(e.code);
      if (e.code === 'Space' && performance.now() - input.spaceStarted < 190) input.cameraToggleQueued = true;
    });
    canvas.addEventListener('mousedown', e => { if (e.button === 0 && game.active) input.jumpQueued = true; });

    function makeCarVisual(color = 0x16a8ff) {
      const root = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({ color, metalness: .62, roughness: .24 });
      const trim = new THREE.MeshStandardMaterial({ color: 0x09121d, metalness: .75, roughness: .3 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x84d8ff, metalness: .65, roughness: .12, transparent: true, opacity: .78 });
      const lower = new THREE.Mesh(new THREE.BoxGeometry(2.65, .72, 4.25), paint); lower.position.y = .08; lower.castShadow = true; root.add(lower);
      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.48, .33, 1.25), paint); hood.position.set(0,.56,-1.18); hood.rotation.x = -.08; hood.castShadow = true; root.add(hood);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.14, .78, 1.72), glass); cabin.position.set(0,.8,.22); cabin.rotation.x = -.04; cabin.castShadow = true; root.add(cabin);
      const spoiler = new THREE.Mesh(new THREE.BoxGeometry(2.75,.14,.48), trim); spoiler.position.set(0,.72,1.88); root.add(spoiler);
      const bumper = new THREE.Mesh(new THREE.BoxGeometry(2.72,.28,.22), trim); bumper.position.set(0,-.2,-2.14); root.add(bumper);
      const wheels = [];
      const wheelGeo = new THREE.CylinderGeometry(.53,.53,.34,18); wheelGeo.rotateZ(Math.PI/2);
      for (const x of [-1.38,1.38]) for (const z of [-1.36,1.36]) {
        const pivot = new THREE.Group(); pivot.position.set(x,-.42,z);
        const wheel = new THREE.Mesh(wheelGeo, trim); wheel.castShadow = true; pivot.add(wheel); root.add(pivot); wheels.push({ pivot, wheel, front: z < 0 });
      }
      const flame = new THREE.Mesh(new THREE.ConeGeometry(.25, 1.8, 8), new THREE.MeshBasicMaterial({ color: 0x62e7ff, transparent: true, opacity: .88, blending: THREE.AdditiveBlending }));
      flame.rotation.x = Math.PI / 2; flame.position.set(0,0,2.92); flame.visible = false; root.add(flame);
      return { root, wheels, flame, paint, trim, glass };
    }

    class ArcadeCar {
      constructor() {
        this.body = new CANNON.Body({
          mass: 820,
          shape: new CANNON.Box(new CANNON.Vec3(1.32,.62,2.12)),
          linearDamping: .07,
          angularDamping: .34,
          position: new CANNON.Vec3(0, 1.2, 28)
        });
        this.body.quaternion.setFromEuler(0, 0, 0);
        physics.addBody(this.body);
        this.visual = makeCarVisual();
        scene.add(this.visual.root);
        this.boost = 100;
        this.grounded = false;
        this.airStart = 0;
        this.jumps = 0;
        this.wheelSpin = 0;
        this.jumpLatch = false;
      }
      reset(x=0,z=28,yaw=0) {
        this.body.position.set(x,1.2,z); this.body.velocity.setZero(); this.body.angularVelocity.setZero(); this.body.force.setZero(); this.body.torque.setZero();
        this.body.quaternion.setFromEuler(0,yaw,0); this.boost = game.training ? 100 : Math.max(this.boost, 33); this.jumps = 0;
      }
      fixedUpdate(dt) {
        const b = this.body;
        const forward = b.quaternion.vmult(new CANNON.Vec3(0,0,-1));
        const right = b.quaternion.vmult(new CANNON.Vec3(1,0,0));
        const up = b.quaternion.vmult(new CANNON.Vec3(0,1,0));
        const ray = new CANNON.RaycastResult();
        physics.raycastClosest(b.position, new CANNON.Vec3(b.position.x,b.position.y-1.15,b.position.z), { skipBackfaces: true }, ray);
        const wasGrounded = this.grounded;
        this.grounded = ray.hasHit && ray.body === floorBody && up.y > .3;
        if (this.grounded && !wasGrounded) this.jumps = 0;
        if (!this.grounded && wasGrounded) this.airStart = performance.now();

        if (this.grounded) {
          const forwardFlat = new CANNON.Vec3(forward.x,0,forward.z); forwardFlat.normalize();
          const rightFlat = new CANNON.Vec3(right.x,0,right.z); rightFlat.normalize();
          const fSpeed = b.velocity.dot(forwardFlat);
          const sSpeed = b.velocity.dot(rightFlat);
          const topSpeed = input.boost && this.boost > 0 ? 44 : 31;
          const engine = input.throttle === 0 ? 0 : (Math.sign(input.throttle) === Math.sign(fSpeed) ? 11800 : 17600) * input.throttle;
          if (Math.abs(fSpeed) < topSpeed || Math.sign(engine) !== Math.sign(fSpeed)) b.applyForce(forwardFlat.scale(engine), b.position);
          const grip = input.handbrake ? .86 : .22;
          b.velocity.x -= rightFlat.x * sSpeed * grip;
          b.velocity.z -= rightFlat.z * sSpeed * grip;
          if (!input.throttle) { b.velocity.x *= .985; b.velocity.z *= .985; }
          const steerScale = THREE.MathUtils.clamp(Math.abs(fSpeed)/5, .15, 1) * (input.handbrake ? 1.5 : 1);
          b.angularVelocity.y += input.steer * 4.3 * steerScale * (fSpeed >= -.5 ? 1 : -1) * dt;
          const align = new CANNON.Vec3(up.z * 9500, 0, -up.x * 9500);
          b.torque.vadd(align, b.torque);
        } else {
          const torque = 5200;
          b.torque.vadd(right.scale(-input.pitch * torque), b.torque);
          b.torque.vadd(up.scale(input.yaw * torque * .72), b.torque);
          b.torque.vadd(forward.scale(input.roll * torque), b.torque);
        }

        if (input.boost && (this.boost > 0 || game.training)) {
          b.applyForce(forward.scale(this.grounded ? 12500 : 9300), b.position);
          if (!game.training) this.boost = Math.max(0, this.boost - 27 * dt);
          this.visual.flame.visible = true;
          this.visual.flame.scale.y = .75 + Math.random() * .5;
          spawnBoostParticle(this);
        } else this.visual.flame.visible = false;

        if (input.jumpQueued) {
          if (this.grounded) {
            b.applyImpulse(new CANNON.Vec3(0, 7200, 0), b.position); this.jumps = 1; this.airStart = performance.now();
          } else if (this.jumps === 1 && performance.now() - this.airStart < 1500) {
            const dodge = forward.scale(input.throttle * 4600).vadd(right.scale(-input.steer * 4600));
            if (Math.abs(input.throttle) + Math.abs(input.steer) < .2) dodge.y += 5800; else dodge.y += 1800;
            b.applyImpulse(dodge, b.position);
            b.angularVelocity.vadd(right.scale(-input.throttle * 6.8), b.angularVelocity);
            b.angularVelocity.vadd(forward.scale(input.steer * 7.4), b.angularVelocity);
            this.jumps = 2;
          }
          input.jumpQueued = false;
        }
        if (b.position.y < -8) this.reset();
      }
      sync(dt) {
        this.visual.root.position.copy(this.body.position);
        this.visual.root.quaternion.copy(this.body.quaternion);
        const speed = this.body.velocity.length();
        this.wheelSpin -= speed * dt * 1.35;
        this.visual.wheels.forEach(w => { w.wheel.rotation.x = this.wheelSpin; if (w.front) w.pivot.rotation.y = input.steer * .38; });
      }
    }

    const boostParticles = [];
    const particleGeo = new THREE.IcosahedronGeometry(.12,0);
    function spawnBoostParticle(car) {
      if (Math.random() > .48) return;
      let p = boostParticles.find(v => !v.mesh.visible);
      if (!p) { const mesh = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ color: Math.random()>.35?0x38c8ff:0xffc14d, transparent:true, blending:THREE.AdditiveBlending })); scene.add(mesh); p={mesh,life:0,velocity:new THREE.Vector3()}; boostParticles.push(p); }
      const back = new THREE.Vector3(0,0,2.65).applyQuaternion(car.visual.root.quaternion).add(car.visual.root.position);
      p.mesh.position.copy(back); p.mesh.visible=true; p.life=.32; p.mesh.scale.setScalar(1);
      p.velocity.set(0,.4,3.5).applyQuaternion(car.visual.root.quaternion).addScaledVector(new THREE.Vector3().copy(car.body.velocity), .08);
    }
    function updateParticles(dt) { for (const p of boostParticles) if (p.mesh.visible) { p.life-=dt; if (p.life<=0) p.mesh.visible=false; else { p.mesh.position.addScaledVector(p.velocity,dt); p.mesh.scale.setScalar(p.life*2.4); p.mesh.material.opacity=p.life*2.6; } } }

    const car = new ArcadeCar();
    const game = { active: false, training: false, ballCam: false, elapsed: 0 };
    const cameraLook = new THREE.Vector3();
    const cameraPos = new THREE.Vector3();
    function updateCamera(dt) {
      if (!game.active) return;
      const carPos = car.visual.root.position;
      const carForward = new THREE.Vector3(0,0,-1).applyQuaternion(car.visual.root.quaternion);
      const planar = new THREE.Vector3(carForward.x,0,carForward.z);
      if (planar.lengthSq() < .01) planar.set(0,0,-1); else planar.normalize();
      const desired = carPos.clone().addScaledVector(planar,-10.5).add(new THREE.Vector3(0,4.8,0));
      cameraPos.lerp(desired, 1-Math.exp(-dt*7));
      camera.position.copy(cameraPos);
      const target = game.ballCam && window.olympicoBall ? window.olympicoBall.position : carPos.clone().addScaledVector(planar,8).add(new THREE.Vector3(0,1.2,0));
      cameraLook.lerp(target,1-Math.exp(-dt*8));
      camera.up.set(0,1,0);
      camera.lookAt(cameraLook);
    }

    let phase = 0, last = performance.now(), accumulator = 0;
    function animate(t) {
      requestAnimationFrame(animate);
      const dt = Math.min((t-last)/1000,.05); last=t;
      phase = t * .00007;
      input.poll();
      if (input.cameraToggleQueued && game.active) { game.ballCam=!game.ballCam; input.cameraToggleQueued=false; document.querySelector('#cameraMode').textContent=`${game.ballCam?'Ball':'Car'} cam · Tap Space / C`; }
      if (game.active) {
        accumulator += dt;
        while (accumulator >= 1/60) { car.fixedUpdate(1/60); physics.step(1/60); accumulator -= 1/60; }
        car.sync(dt); updateParticles(dt); updateCamera(dt);
        const kph = Math.round(car.body.velocity.length()*3.6);
        document.querySelector('#speed').textContent=String(kph).padStart(3,'0');
        document.querySelector('#boostValue').textContent=Math.round(car.boost);
        document.querySelector('#boostCluster').style.setProperty('--boost',car.boost);
      } else {
        camera.position.x = Math.sin(phase) * 40;
        camera.position.z = Math.cos(phase) * 48;
        camera.lookAt(0, 2, 0);
      }
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight, false);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const toast = document.querySelector('#toast');
    let toastTimer;
    function showToast(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
      if (button.dataset.action === 'quick-match') {
        document.querySelector('#menu').classList.add('hidden');
        document.querySelector('#hud').classList.add('visible');
        game.active = true; game.training = false; car.reset(); cameraPos.copy(car.visual.root.position).add(new THREE.Vector3(0,5,10));
        showToast('Kickoff! Tap Space for ball cam · Hold Space to powerslide');
      } else showToast('Coming online in the next build phase.');
    }));
  </script>
</body>
</html>
